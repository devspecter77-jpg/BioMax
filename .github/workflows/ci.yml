name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tekshiruv:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # postinstall `prisma generate` ni ham bajaradi
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Build bazaga ulanmaydi — manzil faqat sozlama tekshiruvidan o'tishi uchun
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-uchun-vaqtinchalik-qiymat
